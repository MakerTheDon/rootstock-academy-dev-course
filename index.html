<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TimeBasedInheritance</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 500; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }
    .contract-address { font-size: 0.75rem; color: #888; word-break: break-all; margin-bottom: 2rem; }
    .contract-address a { color: #3a7fd5; text-decoration: none; }
    #connect-btn { background: #3a7fd5; color: white; border: none; padding: 0.6rem 1.4rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; margin-bottom: 2rem; }
    #connect-btn:hover { background: #2d68b8; }
    #wallet-info { font-size: 0.85rem; color: #555; margin-bottom: 2rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: white; border-radius: 12px; border: 0.5px solid #e0e0e0; padding: 1.25rem; }
    .card h2 { font-size: 1rem; font-weight: 500; margin-bottom: 1rem; }
    .card input { width: 100%; padding: 0.5rem 0.75rem; border: 0.5px solid #ccc; border-radius: 8px; font-size: 0.9rem; margin-bottom: 0.75rem; background: #fafafa; }
    .card input:focus { outline: none; border-color: #3a7fd5; background: white; }
    .card button { width: 100%; padding: 0.55rem; background: #3a7fd5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .card button:hover { background: #2d68b8; }
    .card button:disabled { background: #aaa; cursor: not-allowed; }
    .result { margin-top: 0.75rem; font-size: 0.82rem; color: #444; background: #f0f4ff; border-radius: 6px; padding: 0.6rem 0.75rem; word-break: break-all; min-height: 2rem; }
    .result.error { background: #fff0f0; color: #c0392b; }
    .result.success { background: #f0fff4; color: #1a7a3c; }
    .badge { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-bottom: 0.75rem; }
    .badge.owner { background: #e8f0fe; color: #1a56c4; }
    .badge.beneficiary { background: #e8fef0; color: #1a7a3c; }
    .badge.view { background: #fef8e8; color: #7a5c1a; }
  </style>
</head>
<body>

  <h1>TimeBasedInheritance</h1>
  <p class="subtitle">A decentralized dead man's switch on Rootstock testnet</p>
  <p class="contract-address">
    Contract: <a href="https://explorer.testnet.rootstock.io/address/0x3e97Ffed859c57Fc412213ADb8Bc17EA6aDBE4Ff#code" target="_blank">0x3e97Ffed859c57Fc412213ADb8Bc17EA6aDBE4Ff</a>
  </p>

  <button id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
  <p id="wallet-info">Not connected</p>

  <div class="cards">

    <div class="card">
      <span class="badge owner">Owner</span>
      <h2>Register Asset</h2>
      <input id="reg-assetId" placeholder="Asset ID (e.g. 0x1234...)" />
      <input id="reg-beneficiary" placeholder="Beneficiary address (0x...)" />
      <button onclick="registerAsset()">Register</button>
      <div class="result" id="reg-result"></div>
    </div>

    <div class="card">
      <span class="badge owner">Owner</span>
      <h2>Check In</h2>
      <input id="checkin-assetId" placeholder="Asset ID (e.g. 0x1234...)" />
      <button onclick="checkIn()">Check In</button>
      <div class="result" id="checkin-result"></div>
    </div>

    <div class="card">
      <span class="badge beneficiary">Beneficiary</span>
      <h2>Claim Inheritance</h2>
      <input id="claim-assetId" placeholder="Asset ID (e.g. 0x1234...)" />
      <button onclick="claimInheritance()">Claim</button>
      <div class="result" id="claim-result"></div>
    </div>

    <div class="card">
      <span class="badge view">View</span>
      <h2>View Asset</h2>
      <input id="view-assetId" placeholder="Asset ID (e.g. 0x1234...)" />
      <button onclick="getAsset()">View</button>
      <div class="result" id="view-result"></div>
    </div>

  </div>

  <script>
    const CONTRACT_ADDRESS = "0x3e97Ffed859c57Fc412213ADb8Bc17EA6aDBE4Ff";
    const ABI = [
      "function registerAsset(bytes32 assetId, address beneficiary) external",
      "function checkIn(bytes32 assetId) external",
      "function claimInheritance(bytes32 assetId) external",
      "function getAsset(bytes32 assetId) external view returns (address owner, address beneficiary, uint256 lastCheckIn, bool isActive, uint256 timeUntilClaim)"
    ];

    let provider, signer, contract;

    async function connectWallet() {
      try {
        if (!window.ethereum) {
          alert("Please install MetaMask to use this app.");
          return;
        }
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const network = await provider.getNetwork();
        if (network.chainId !== 31n) {
          try {
            await window.ethereum.request({
              method: "wallet_switchEthereumChain",
              params: [{ chainId: "0x1f" }]
            });
          } catch (e) {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: "0x1f",
                chainName: "Rootstock Testnet",
                nativeCurrency: { name: "tRBTC", symbol: "tRBTC", decimals: 18 },
                rpcUrls: ["https://public-node.testnet.rsk.co"],
                blockExplorerUrls: ["https://explorer.testnet.rootstock.io"]
              }]
            });
          }
          provider = new ethers.BrowserProvider(window.ethereum);
        }
        signer = await provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
        const addr = await signer.getAddress();
        document.getElementById("wallet-info").textContent = "Connected: " + addr;
        document.getElementById("connect-btn").textContent = "Connected";
        document.getElementById("connect-btn").style.background = "#1a7a3c";
      } catch (e) {
        alert("Connection failed: " + e.message);
      }
    }

    function toBytes32(val) {
      if (val.startsWith("0x")) return ethers.zeroPadValue(val, 32);
      return ethers.encodeBytes32String(val);
    }

    function setResult(id, msg, type) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = "result " + (type || "");
    }

    async function registerAsset() {
      if (!contract) return setResult("reg-result", "Please connect your wallet first.", "error");
      try {
        const assetId = toBytes32(document.getElementById("reg-assetId").value.trim());
        const beneficiary = document.getElementById("reg-beneficiary").value.trim();
        setResult("reg-result", "Sending transaction...");
        const tx = await contract.registerAsset(assetId, beneficiary);
        setResult("reg-result", "Waiting for confirmation...");
        await tx.wait();
        setResult("reg-result", "Asset registered! Tx: " + tx.hash, "success");
      } catch (e) {
        setResult("reg-result", "Error: " + (e.reason || e.message), "error");
      }
    }

    async function checkIn() {
      if (!contract) return setResult("checkin-result", "Please connect your wallet first.", "error");
      try {
        const assetId = toBytes32(document.getElementById("checkin-assetId").value.trim());
        setResult("checkin-result", "Sending transaction...");
        const tx = await contract.checkIn(assetId);
        setResult("checkin-result", "Waiting for confirmation...");
        await tx.wait();
        setResult("checkin-result", "Checked in! Tx: " + tx.hash, "success");
      } catch (e) {
        setResult("checkin-result", "Error: " + (e.reason || e.message), "error");
      }
    }

    async function claimInheritance() {
      if (!contract) return setResult("claim-result", "Please connect your wallet first.", "error");
      try {
        const assetId = toBytes32(document.getElementById("claim-assetId").value.trim());
        setResult("claim-result", "Sending transaction...");
        const tx = await contract.claimInheritance(assetId);
        setResult("claim-result", "Waiting for confirmation...");
        await tx.wait();
        setResult("claim-result", "Inheritance claimed! Tx: " + tx.hash, "success");
      } catch (e) {
        setResult("claim-result", "Error: " + (e.reason || e.message), "error");
      }
    }

    async function getAsset() {
      if (!contract) return setResult("view-result", "Please connect your wallet first.", "error");
      try {
        const assetId = toBytes32(document.getElementById("view-assetId").value.trim());
        const result = await contract.getAsset(assetId);
        const days = Math.round(Number(result.timeUntilClaim) / 86400);
        setResult("view-result",
          "Owner: " + result.owner + "\n" +
          "Beneficiary: " + result.beneficiary + "\n" +
          "Active: " + result.isActive + "\n" +
          "Time until claim: " + days + " days",
          "success"
        );
      } catch (e) {
        setResult("view-result", "Error: " + (e.reason || e.message), "error");
      }
    }
  </script>

</body>
</html>
